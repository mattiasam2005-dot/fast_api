[tool.poetry]
name = "fastapi-products"
version = "0.1.0"
description = "Progetto didattico FastAPI - Products API"
authors = ["Mattia Gabriele Sammarco"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<1.0"}

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"